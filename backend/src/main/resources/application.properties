spring.application.name=meeting-booking-backend

# ===============================
# Database Configuration (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/meeting_booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Set timezone for database operations
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
# ===============================
# JWT Settings
# ===============================
app.jwt.secret=myVerySecureSecretKeyForJWTThatIsAtLeast32CharactersLongForSecurity123456
app.jwt.expiration-ms=86400000

# ===============================
# Server
# ===============================
server.port=8080



